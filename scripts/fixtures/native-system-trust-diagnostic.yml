name: Native system trust diagnostic
on:
  push:
    branches: [qualification/native-linux-build]
permissions:
  contents: read
jobs:
  selected_native_source:
    if: github.repository == 'mmdaaboul/paperclip' && github.ref == 'refs/heads/qualification/native-linux-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Trust refusal diagnostic contracts
        env:
          PAPERCLIP_DIAGNOSTIC_TEST_SCRATCH: ${{ runner.temp }}
        run: node --test --test-name-pattern='trust diagnostic|trust refusal|actual parent' scripts/qualify-native-sandbox.test.mjs
      - name: Read fixed system trust metadata
        run: node scripts/qualify-native-sandbox.mjs --diagnose-system-trust
      - name: Upload diagnostic only
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-system-trust-diagnostic
          path: ${{ runner.temp }}/native-system-trust-diagnostic.json
          if-no-files-found: error
          retention-days: 14
